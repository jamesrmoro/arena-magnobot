<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Arena Magnobot — arcade retrô de robô magnético</title>
<meta name="description" content="Arcade retrô: comande um robô magnético, colete caixas, desvie de fantasmas e bata seu recorde. Joga no navegador, no celular e offline.">
<meta name="theme-color" content="#050d16">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arena Magnobot">

<link rel="icon" type="image/png" sizes="96x96" href="./assets/favicon/favicon-96x96.png">
<link rel="apple-touch-icon" sizes="180x180" href="./assets/favicon/apple-touch-icon.png">
<link rel="manifest" href="./manifest.json">

<meta property="og:type" content="website">
<meta property="og:title" content="Arena Magnobot">
<meta property="og:description" content="Arcade retrô de robô magnético: colete, desvie e sobreviva.">
<meta property="og:image" content="./assets/images/cover.jpg">
<meta name="twitter:card" content="summary_large_image">

<link rel="preload" as="image" href="./assets/images/robot.png">
<link rel="preload" as="image" href="./assets/images/box.png">
<link rel="preload" as="image" href="./assets/images/logo-360.webp" type="image/webp">
<link rel="stylesheet" href="./assets/css/style.css?v=6">
</head>
<body>

<!-- Carregamento: barra real de progresso em vez de tela preta -->
<div id="loader" role="status" aria-live="polite">
  <picture>
    <source srcset="./assets/images/logo-360.webp" type="image/webp">
    <img class="loader-logo-img" src="./assets/images/logo-360.jpg" width="360" height="360"
         alt="Arena Magnobot" fetchpriority="high">
  </picture>
  <div class="loader-track"><div id="loaderBar"></div></div>
  <p data-i18n="loading">Carregando</p>
</div>

<!-- HUD -->
<header id="hud">
  <div class="hud-group">
    <span class="hud-chip"><b data-i18n="points">Pontos</b> <strong id="hudScore">0</strong></span>
    <span class="hud-chip hud-chip--ghost"><b data-i18n="best">Recorde</b> <strong id="hudBest">0</strong></span>
    <span class="hud-badge hud-badge--combo" id="hudCombo" hidden>x1</span>
    <span class="hud-badge hud-badge--shield" id="hudShield" hidden>🛡</span>
  </div>
  <div class="hud-group">
    <button id="btnPause" class="icon-btn" type="button" aria-label="Pausar" title="P">⏸</button>
    <button id="btnSound" class="icon-btn" type="button" aria-pressed="true">🔊</button>
  </div>
</header>

<!-- Tabuleiro -->
<main id="stage">
  <div class="collect-col" id="collectLeft" aria-hidden="true"></div>
  <div id="boardWrap">
    <div class="board-stack" id="boardStack">
      <canvas id="gameCanvas" aria-label="Arena do jogo" role="img"></canvas>
      <div class="corner-flag" id="flag-tl" aria-hidden="true"></div>
      <div class="corner-flag" id="flag-tr" aria-hidden="true"></div>
      <div class="corner-flag" id="flag-bl" aria-hidden="true"></div>
      <div class="corner-flag" id="flag-br" aria-hidden="true"></div>
    </div>
  </div>
  <div class="collect-col" id="collectRight" aria-hidden="true"></div>
</main>

<!-- Direcional na tela (aparece só em aparelhos com toque) -->
<nav id="dpad" aria-label="Controles">
  <button type="button" data-dir="up" class="dpad-btn dpad-up" aria-label="Cima">▲</button>
  <button type="button" data-dir="left" class="dpad-btn dpad-left" aria-label="Esquerda">◀</button>
  <button type="button" data-dir="right" class="dpad-btn dpad-right" aria-label="Direita">▶</button>
  <button type="button" data-dir="down" class="dpad-btn dpad-down" aria-label="Baixo">▼</button>
</nav>

<footer id="appFooter">
  <button id="btnInstall" class="link-btn" type="button" hidden data-i18n="install">Instalar</button>
  <button id="btnHelp" class="link-btn" type="button" data-i18n="howTo">Como jogar</button>
  <button id="btnAbout" class="link-btn" type="button" data-i18n="about">Sobre</button>
</footer>

<div id="toast" role="status" aria-live="polite"></div>

<!-- Menu -->
<section id="screen-menu" class="screen">
  <div class="panel panel--menu">
    <h1 class="logo-wrap">
      <picture>
        <source srcset="./assets/images/logo-360.webp" type="image/webp">
        <img class="logo-img" src="./assets/images/logo-360.jpg" width="360" height="360"
             alt="Arena Magnobot">
      </picture>
    </h1>
    <p class="tagline" data-i18n="tagline">Colete, desvie, sobreviva.</p>
    <button id="btnPlay" class="btn btn--primary" type="button" data-i18n="play">Jogar</button>
    <p class="hint hint--desktop" data-i18n="pressToStart">Pressione Espaço para começar</p>
    <p class="hint hint--touch" data-i18n="tapToStart">Toque para começar</p>

<!-- Contagem -->
<section id="screen-countdown" class="screen screen--bare">
  <div id="countdownText">3</div>
</section>

<!-- Pausa -->
<section id="screen-pause" class="screen">
  <div class="panel">
    <h2 data-i18n="paused">Pausado</h2>
    <button id="btnResume" class="btn btn--primary" type="button" data-i18n="resume">Continuar</button>
    <button id="btnQuit" class="btn" type="button" data-i18n="quit">Sair</button>
  </div>
</section>

<!-- Fim de jogo -->
<section id="screen-over" class="screen">
  <div class="panel">
    <h2 data-i18n="gameOver">Fim de jogo</h2>
    <p id="overRecord" class="record-badge" data-i18n="newRecord" hidden>Novo recorde!</p>
    <div class="score-grid">
      <div><span data-i18n="yourScore">Sua pontuação</span><strong id="overScore">0</strong></div>
      <div><span data-i18n="boxes">Caixas</span><strong id="overBoxes">0</strong></div>
      <div><span data-i18n="best">Recorde</span><strong id="overBest">0</strong></div>
    </div>
    <button id="btnPlayAgain" class="btn btn--primary" type="button" data-i18n="playAgain">Jogar de novo</button>
    <button id="btnHome" class="btn" type="button" data-i18n="home">Início</button>
  </div>
</section>

<!-- Como jogar: ilustração em CSS, sem o GIF de 2,6 MB -->
<div id="modal-help" class="modal">
  <div class="panel panel--wide">
    <h2 data-i18n="howTo">Como jogar</h2>
    <ul class="help-list">
      <li><span class="help-ico help-ico--move"></span><span class="help-txt help-txt--touch" data-i18n="helpMoveTouch"></span><span class="help-txt help-txt--desktop" data-i18n="helpMoveKeys"></span></li>
      <li><span class="help-ico help-ico--box"></span><span data-i18n="helpGoal"></span></li>
      <li><span class="help-ico help-ico--ghost"></span><span data-i18n="helpGhost"></span></li>
      <li><span class="help-ico help-ico--power"></span><span data-i18n="helpPower"></span></li>
      <li><span class="help-ico help-ico--shield"></span><span data-i18n="helpShield"></span></li>
      <li><span class="help-ico help-ico--combo"></span><span data-i18n="helpCombo"></span></li>
    </ul>
    <button id="btnCloseHelp" class="btn btn--primary" type="button" data-i18n="gotIt">Entendi</button>
  </div>
</div>

<!-- Sobre -->
<div id="modal-about" class="modal">
  <div class="panel panel--wide">
    <h2 data-i18n="about">Sobre</h2>
    <div class="prose" data-i18n-html="aboutHtml"></div>
    <button id="btnCloseAbout" class="btn btn--primary" type="button" data-i18n="close">Fechar</button>
  </div>
</div>

<!-- Áudio. A trilha usa preload=none e data-src: só baixa quando vai tocar. -->
<audio id="sfx-bg" loop preload="none">
  <source data-src="./assets/sounds/bg.ogg" type="audio/ogg">
  <source data-src="./assets/sounds/bg.mp3" type="audio/mpeg">
</audio>

<audio id="sfx-power" preload="none"><source src="./assets/sounds/power.ogg" type="audio/ogg"><source src="./assets/sounds/power.mp3" type="audio/mpeg"></audio>
<audio id="sfx-gameover" preload="none"><source src="./assets/sounds/gameover.ogg" type="audio/ogg"><source src="./assets/sounds/gameover.mp3" type="audio/mpeg"></audio>
<audio id="sfx-ghost" preload="none"><source src="./assets/sounds/ghost.ogg" type="audio/ogg"><source src="./assets/sounds/ghost.mp3" type="audio/mpeg"></audio>
<audio id="sfx-activate" preload="none"><source src="./assets/sounds/activate.ogg" type="audio/ogg"><source src="./assets/sounds/activate.mp3" type="audio/mpeg"></audio>
<audio id="sfx-final" preload="none"><source src="./assets/sounds/final.ogg" type="audio/ogg"><source src="./assets/sounds/final.mp3" type="audio/mpeg"></audio>
